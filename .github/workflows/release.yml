name: release

# Official releases come from git tags `v*` (prerelease = false).
# Every push to `main` publishes a `snapshot-<sha>` prerelease, which the plugin
# only installs when the user opts into snapshots.
#
# All the project logic lives in the mise-tasks/ scripts (plain bash, runnable
# locally with `mise run <task>` or directly with `bash mise-tasks/<task>`), so
# this workflow only bootstraps the runner and calls them — mise is not needed.
on:
  push:
    tags: ['v*']
    branches: [main]
  pull_request:  # lint, test and build only

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create releases
    steps:
      - name: Checkout (full history for the changelog)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            lua5.1 luarocks zip jq curl ca-certificates build-essential libreadline-dev
          sudo luarocks install luacheck
          sudo luarocks install busted

      - name: Lint
        run: bash mise-tasks/lint

      - name: Test
        run: bash mise-tasks/test

      - name: Build the release artifact
        run: bash mise-tasks/build

      - name: Publish the release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash mise-tasks/release
